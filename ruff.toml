# Ruff is the one linter and formatter for the Python this repo ships.
#
# There is no pyproject.toml here (this is a skills repo, not a Python package),
# so config lives in exactly one file: this one.
#
# Everything under skills/ runs on a *user's* machine after `npx skills add`,
# which is why `S` (flake8-bandit) is on: a security finding in a bundled script
# is a finding in every repo that installs it. Keep the runtime stdlib-only —
# Ruff is dev tooling, pinned in requirements-dev.txt.

# Formatter output and the rule catalog move between minor releases, so an
# unpinned Ruff makes local, teammate and CI runs disagree. This makes the pin
# self-enforcing: a stale `ruff` on someone's PATH refuses to run rather than
# producing a different answer than CI. Keep in step with requirements-dev.txt
# and .pre-commit-config.yaml.
required-version = "0.15.10"

target-version = "py310"   # the floor CONTRIBUTING.md promises
line-length = 100

exclude = [
    "managed-skills",      # archived research packs, not our code
    ".local",
]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "S",        # flake8-bandit — the reason this file exists
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is the formatter's business, not the linter's
    # The three bandit rules below fire on the two idioms every skill script is
    # built from, at a true-positive rate of roughly zero. Measured across 21
    # generated repos they produced ~420 of ~790 findings and not one real defect.
    # What they are meant to catch is caught properly elsewhere: validate_skills.py
    # errors on shell=True, on downloads piped into a shell, and on environments
    # piped into a network command — the things that actually compromise a user.
    "S101",     # assert — skill scripts carry inline `--self-test` blocks by design
    "S603",     # subprocess with an argv list and no shell: the safe form
    "S607",     # partial executable path — `git`/`gh`/`npx` off PATH is the point
]

[format]
docstring-code-format = true
